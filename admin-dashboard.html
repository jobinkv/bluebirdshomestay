<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bluebirds Homestay</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-dashboard {
            padding: var(--spacing-xl) var(--spacing-lg);
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--glass-border);
        }

        .dashboard-header h1 {
            color: var(--white);
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 71, 87, 0.3);
        }

        .room-manager-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: var(--spacing-lg);
        }

        .room-edit-card {
            background: var(--bg-glass);
            padding: var(--spacing-lg);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .room-edit-card h3 {
            color: var(--accent-light);
            margin-bottom: var(--spacing-md);
        }

        .edit-form-group {
            margin-bottom: 15px;
        }

        .edit-form-group label {
            display: block;
            color: var(--light-secondary);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .edit-form-group input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }

        .save-btn:hover {
            opacity: 0.9;
        }

        .image-preview-admin {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #111;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .booking-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            gap: 10px;
        }

        .booking-guest {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 5px;
        }

        .booking-dates {
            font-size: 0.85rem;
            color: var(--light-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .booking-detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .booking-detail-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .booking-detail-value {
            font-size: 1rem;
            color: var(--white);
            font-weight: 500;
        }

        .call-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }

        .call-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .call-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .booking-details {
                grid-template-columns: 1fr 1fr;
            }

            .call-btn {
                font-size: 1rem;
                padding: 14px 24px;
            }
        }

        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            color: var(--light-secondary);
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent-light);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ed573;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }

        /* Image Manager Styles */
        .image-manager {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .image-manager h4 {
            color: var(--accent-light);
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .images-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 15px;
        }

        .image-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 12px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .image-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .image-item img {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #111;
        }

        .image-item-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .image-item-details input[type="text"] {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .image-item-details .file-name {
            font-size: 0.75rem;
            color: var(--light-secondary);
        }

        .remove-image-btn {
            padding: 8px 12px;
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        .remove-image-btn:hover {
            background: rgba(255, 71, 87, 0.3);
        }

        .add-image-btn {
            width: 100%;
            padding: 12px;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border: 2px dashed rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-image-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .add-image-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upload-progress {
            margin-top: 5px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .upload-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            transition: width 0.3s ease;
        }
    </style>
</head>

<body>
    <!-- Security Check -->
    <script>
        if (!sessionStorage.getItem('bluebirds_admin')) {
            window.location.href = 'admin.html';
        }
    </script>

    <div class="admin-dashboard">
        <header class="dashboard-header">
            <div>
                <h1>Bluebirds Admin Dashboard</h1>
                <p style="color: var(--light-secondary)">Manage your rooms and gallery images</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <!-- Tab Navigation -->
        <div
            style="display: flex; gap: 10px; margin-bottom: var(--spacing-xl); border-bottom: 2px solid var(--glass-border);">
            <button class="tab-btn active" onclick="switchTab('bookings')" id="bookingsTab">
                <span style="font-size: 1.2rem;">📋</span> Received Bookings
            </button>
            <button class="tab-btn" onclick="switchTab('rooms')" id="roomsTab">
                <span style="font-size: 1.2rem;">🛏️</span> Edit Room Details
            </button>
        </div>

        <!-- Bookings Section -->
        <div id="bookingsSection" class="tab-content active">
            <div class="room-edit-card" style="border: 2px solid #3b82f6;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="display: flex; align-items: center; gap: 10px; margin: 0;">
                        <span style="font-size: 1.5rem;">📋</span> Received Bookings
                    </h3>
                    <button onclick="refreshBookings()" id="refreshBookingsBtn"
                        style="padding: 10px 20px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease;">
                        <span style="font-size: 1.2rem;">🔄</span>
                        <span>Refresh</span>
                    </button>
                </div>
                <div id="bookingsContainer" style="display: grid; gap: 15px;">
                    <!-- Bookings will be loaded here -->
                    <div style="text-align: center; padding: 2rem; color: var(--light-secondary);">
                        <div class="sync-loader"
                            style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;">
                        </div>
                        Loading bookings...
                    </div>
                </div>
            </div>
        </div>

        <!-- Rooms Section -->
        <div id="roomsSection" class="tab-content">
            <div id="roomContainer" class="room-manager-grid">
                <!-- Room cards will be injected here -->
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Changes saved successfully!</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="rooms-data.js"></script>
    <script>
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab content
            if (tabName === 'bookings') {
                document.getElementById('bookingsSection').classList.add('active');
                document.getElementById('bookingsTab').classList.add('active');
            } else if (tabName === 'rooms') {
                document.getElementById('roomsSection').classList.add('active');
                document.getElementById('roomsTab').classList.add('active');
            }
        }

        function logout() {
            sessionStorage.removeItem('bluebirds_admin');
            window.location.href = 'admin.html';
        }

        const container = document.getElementById('roomContainer');
        const rooms = roomManager.getAllRooms();
        const SUPABASE_STORAGE_BUCKET = 'room-images';
        const MAX_IMAGES = 10;

        // Store pending uploads for each room
        const pendingUploads = {};

        function renderDashboard() {
            container.innerHTML = '';
            Object.keys(rooms).forEach(id => {
                const room = rooms[id];
                const card = document.createElement('div');
                card.className = 'room-edit-card';
                card.innerHTML = `
                    <h3>Room ${id}</h3>
                    <form onsubmit="saveRoom(event, '${id}')">
                        <div class="edit-form-group">
                            <label>Room Name</label>
                            <input type="text" name="name" value="${room.name}" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="edit-form-group">
                                <label>Room Size</label>
                                <input type="text" name="size" value="${room.size || ''}" placeholder="e.g. 14 x 16 ft">
                            </div>
                            <div class="edit-form-group">
                                <label>Bed Size</label>
                                <input type="text" name="bedSize" value="${room.bedSize || ''}" placeholder="e.g. 6 x 7 ft">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="edit-form-group">
                                <label>Weekday Rate (₹)</label>
                                <input type="number" name="weekdayPrice" value="${room.weekdayPrice}" required>
                            </div>
                            <div class="edit-form-group">
                                <label>Weekend Rate (₹)</label>
                                <input type="number" name="weekendPrice" value="${room.weekendPrice}" required>
                            </div>
                        </div>
                        <div class="edit-form-group">
                            <label>Amenities (Comma separated)</label>
                            <textarea name="amenities" style="width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--white); border-radius: 6px; box-sizing: border-box; min-height: 80px;">${(room.amenities || []).join(', ')}</textarea>
                        </div>
                        
                        <!-- Image Manager -->
                        <div class="image-manager">
                            <h4>📸 Room Images (up to ${MAX_IMAGES})</h4>
                            <div class="images-grid" id="images-grid-${id}">
                                <!-- Images will be rendered here -->
                            </div>
                            <button type="button" class="add-image-btn" id="add-image-btn-${id}" onclick="addImageSlot('${id}')">
                                <span>➕</span> Add Image
                            </button>
                        </div>
                        
                        <button type="submit" class="save-btn" id="save-btn-${id}">Save Changes</button>
                    </form>
                `;
                container.appendChild(card);

                // Initialize pending uploads for this room
                if (!pendingUploads[id]) {
                    pendingUploads[id] = [];
                }

                // Render existing images
                renderImages(id, room.images || []);
            });
        }

        function renderImages(roomId, images) {
            const grid = document.getElementById(`images-grid-${roomId}`);
            const addBtn = document.getElementById(`add-image-btn-${roomId}`);

            grid.innerHTML = '';

            images.forEach((img, index) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                imageItem.innerHTML = `
                    <img src="${img.src}" alt="${img.caption || 'Room image'}">
                    <div class="image-item-details">
                        <input type="text" placeholder="Image caption..." value="${img.caption || ''}" 
                               onchange="updateImageCaption('${roomId}', ${index}, this.value)">
                        <div class="file-name">Image ${index + 1}</div>
                    </div>
                    <button type="button" class="remove-image-btn" onclick="removeImage('${roomId}', ${index})">
                        🗑️ Remove
                    </button>
                `;
                grid.appendChild(imageItem);
            });

            // Disable add button if max images reached
            addBtn.disabled = images.length >= MAX_IMAGES;
        }

        function addImageSlot(roomId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => handleFileSelect(e, roomId);
            input.click();
        }

        async function handleFileSelect(event, roomId) {
            const file = event.target.files[0];
            if (!file) return;

            const room = rooms[roomId];
            const currentImages = room.images || [];

            if (currentImages.length >= MAX_IMAGES) {
                alert(`Maximum ${MAX_IMAGES} images allowed per room`);
                return;
            }

            // Create temporary preview
            const reader = new FileReader();
            reader.onload = (e) => {
                const newImage = {
                    src: e.target.result,
                    caption: '',
                    file: file,  // Store file for upload
                    isPending: true
                };

                room.images.push(newImage);
                renderImages(roomId, room.images);
                showToast('Image added. Click "Save Changes" to upload.');
            };
            reader.readAsDataURL(file);
        }

        function removeImage(roomId, index) {
            const room = rooms[roomId];
            room.images.splice(index, 1);
            renderImages(roomId, room.images);
            showToast('Image removed');
        }

        function updateImageCaption(roomId, index, caption) {
            const room = rooms[roomId];
            if (room.images[index]) {
                room.images[index].caption = caption;
            }
        }

        async function uploadImageToSupabase(file, roomId, imageIndex) {
            if (!supabaseClient) {
                throw new Error('Supabase client not initialized');
            }

            const fileExt = file.name.split('.').pop();
            const fileName = `${roomId}/image_${imageIndex + 1}.${fileExt}`;

            const { data, error } = await supabaseClient.storage
                .from(SUPABASE_STORAGE_BUCKET)
                .upload(fileName, file, {
                    cacheControl: '3600',
                    upsert: true
                });

            if (error) throw error;

            // Get public URL
            const { data: urlData } = supabaseClient.storage
                .from(SUPABASE_STORAGE_BUCKET)
                .getPublicUrl(fileName);

            return urlData.publicUrl;
        }

        async function saveRoom(e, id) {
            e.preventDefault();
            const form = e.target;
            const saveBtn = document.getElementById(`save-btn-${id}`);
            const formData = new FormData(form);

            const amenitiesRaw = formData.get('amenities');
            const amenitiesArray = amenitiesRaw ? amenitiesRaw.split(',').map(a => a.trim()).filter(a => a !== '') : [];

            // UI Feedback
            saveBtn.disabled = true;
            saveBtn.textContent = '⌛ Uploading images...';
            saveBtn.style.opacity = '0.7';

            try {
                const room = rooms[id];
                const images = room.images || [];

                // Upload any pending images
                const uploadedImages = [];
                for (let i = 0; i < images.length; i++) {
                    const img = images[i];

                    if (img.file && img.isPending) {
                        // Upload to Supabase Storage
                        try {
                            const publicUrl = await uploadImageToSupabase(img.file, id, i);
                            uploadedImages.push({
                                src: publicUrl,
                                caption: img.caption || ''
                            });
                            saveBtn.textContent = `⌛ Uploading ${i + 1}/${images.length}...`;
                        } catch (uploadError) {
                            console.error('Upload error:', uploadError);
                            throw new Error(`Failed to upload image ${i + 1}: ${uploadError.message}`);
                        }
                    } else {
                        // Keep existing image
                        uploadedImages.push({
                            src: img.src,
                            caption: img.caption || ''
                        });
                    }
                }

                saveBtn.textContent = '⌛ Saving to database...';

                const updatedData = {
                    name: formData.get('name'),
                    size: formData.get('size'),
                    bedSize: formData.get('bedSize'),
                    weekdayPrice: formData.get('weekdayPrice'),
                    weekendPrice: formData.get('weekendPrice'),
                    images: uploadedImages,
                    amenities: amenitiesArray
                };

                const result = await roomManager.updateRoom(id, updatedData);
                if (result.success) {
                    showToast('✅ Changes saved successfully!');
                    rooms[id] = { ...rooms[id], ...updatedData };
                    renderDashboard();
                } else {
                    throw new Error(result.message || 'Database update failed');
                }
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving: ' + error.message);
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
                saveBtn.style.opacity = '1';
            }
        }

        async function handlePushToSupabase() {
            if (!confirm('This will upload all current local room data to Supabase. Continue?')) return;

            showToast('Pushing data to Supabase...');
            const result = await roomManager.pushLocalToSupabase();
            if (result.success) {
                showToast(result.message);
                updateStatusDisplay('Data pushed successfully!');
            } else {
                alert('Push Error: ' + result.message);
            }
        }

        async function handleRefreshFromSupabase() {
            showToast('Refreshing from Supabase...');
            const result = await roomManager.syncFromSupabase();
            if (result.success) {
                showToast('Refreshed successfully!');
                location.reload();
            } else {
                alert('Refresh Error: ' + result.message);
            }
        }

        function updateStatusDisplay(msg) {
            const statusDiv = document.getElementById('dbStatus');
            if (msg) statusDiv.textContent = 'Status: ' + msg;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function loadBookings() {
            const container = document.getElementById('bookingsContainer');

            if (!supabaseClient) {
                container.innerHTML = '<p style="color: #ff4757; text-align: center;">Supabase client not initialized</p>';
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('bookings')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: var(--light-secondary);">
                            <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">📭</span>
                            <p>No bookings received yet</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.map(booking => {
                    const checkIn = new Date(booking.check_in);
                    const checkOut = new Date(booking.check_out);
                    const formatDate = (date) => {
                        return date.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });
                    };

                    return `
                        <div class="booking-card">
                            <div class="booking-header">
                                <div>
                                    <div class="booking-guest">${booking.guest_name || 'Guest'}</div>
                                    <div class="booking-dates">
                                        <span>📅</span>
                                        <span>${formatDate(checkIn)} → ${formatDate(checkOut)}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="booking-details">
                                <div class="booking-detail-item">
                                    <span class="booking-detail-label">Phone</span>
                                    <span class="booking-detail-value">${booking.phone}</span>
                                </div>
                                <div class="booking-detail-item">
                                    <span class="booking-detail-label">Rooms</span>
                                    <span class="booking-detail-value">${booking.num_rooms || 1}</span>
                                </div>
                                <div class="booking-detail-item">
                                    <span class="booking-detail-label">Check-in</span>
                                    <span class="booking-detail-value">${formatDate(checkIn)}</span>
                                </div>
                                <div class="booking-detail-item">
                                    <span class="booking-detail-label">Check-out</span>
                                    <span class="booking-detail-value">${formatDate(checkOut)}</span>
                                </div>
                            </div>
                            <a href="tel:${booking.phone}" class="call-btn">
                                <span style="font-size: 1.2rem;">📞</span>
                                <span>Call Guest</span>
                            </a>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading bookings:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: #ff4757;">
                        <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">⚠️</span>
                        <p>Error loading bookings: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function refreshBookings() {
            const btn = document.getElementById('refreshBookingsBtn');
            const icon = btn.querySelector('span:first-child');
            const text = btn.querySelector('span:last-child');

            // Disable button and show loading state
            btn.disabled = true;
            btn.style.opacity = '0.7';
            text.textContent = 'Refreshing...';
            icon.style.animation = 'spin 1s linear infinite';

            try {
                // Reload bookings from database
                await loadBookings();

                // Show success feedback
                showToast('Bookings refreshed successfully!');

                // Reset button state
                setTimeout(() => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    text.textContent = 'Refresh';
                    icon.style.animation = '';
                }, 500);
            } catch (error) {
                console.error('Error refreshing bookings:', error);
                showToast('Error refreshing bookings');

                // Reset button state
                btn.disabled = false;
                btn.style.opacity = '1';
                text.textContent = 'Refresh';
                icon.style.animation = '';
            }
        }

        async function initDashboard() {
            if (typeof roomManager !== 'undefined') {
                await roomManager.init();
                // updateStatusDisplay(); // Not needed yet
                renderDashboard();
            }
            // Load bookings
            await loadBookings();
        }

        initDashboard();
    </script>
</body>

</html>
